services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinego-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cinego?serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cinego_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-please-use-a-secret-of-at-least-32-chars}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: cinego-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cinego
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cinego_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - cinego_mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cinego_mysql_data:
    name: cinego_mysql_data
